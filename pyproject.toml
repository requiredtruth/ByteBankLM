[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bytebanklm"
version = "0.1.0"
description = "Byte-exact admission planner for concurrent local LLM jobs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "RequiredTruth"}]
[project.scripts]
bytebanklm = "bytebanklm.cli:main"
[tool.setuptools.packages.find]
include = ["bytebanklm*"]
